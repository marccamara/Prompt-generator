name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
      actions: write
      workflows: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install ios-builder
        run: brew install mobai-app/tap/ios-builder

      - name: Authenticate Builder
        run: builder auth github

      - name: Initialize builder config
        run: echo "Prompt-generator" | builder init

      - name: Build IPA
        run: builder ios build --unsigned

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-generator-ipa
          path: dist/*.ipa
