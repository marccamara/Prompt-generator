name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install nitron
        run: npm install -g nitron

      - name: Build IPA
        run: |
          nitron build --target ios --output build/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-generator-ipa
          path: build/*.ipa
